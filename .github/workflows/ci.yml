name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          # Tracked files only, so a deleted directory can never turn into an
          # unmatched glob that node tries to parse as a filename.
          while IFS= read -r file; do node --check "$file"; done < <(git ls-files '*.mjs')
          while IFS= read -r file; do sh -n "$file"; done < <(git ls-files '*.sh')

      - name: Tests
        run: npm test
